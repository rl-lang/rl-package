name: rl-package
description: Package a .rl file into self-contained binaries for Linux, macOS, and Windows

branding:
  icon: 'box'
  color: 'blue'

inputs:
  file:
    description: Path to the .rl source file (relative to calling repo root)
    required: true
  output:
    description: Output binary name (without extension)
    required: false
    default: program
  version:
    description: 'RL version: latest, nightly, or vX.Y.Z (e.g. v2.2.0). Defaults to the latest stable release.'
    required: false
    default: 'latest'
  vm:
    description: 'Compile to .rlc bytecode first and embed that instead of raw source text'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: rl-lang/rl-setup@main
      with:
        version: ${{ inputs.version }}
        binaries: rl

    - name: Create output dir
      shell: bash
      run: mkdir -p bin

    - name: Package (Linux/macOS)
      shell: bash
      if: runner.os != 'Windows'
      run: |
        ARGS=()
        [ "${{ inputs.vm }}" = "true" ] && ARGS+=(--vm)
        rl package "${{ inputs.file }}" -o "bin/${{ inputs.output }}" "${ARGS[@]}"

    - name: Package (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        $extra = @()
        if ("${{ inputs.vm }}" -eq "true") { $extra += "--vm" }
        rl package "${{ inputs.file }}" -o "bin\${{ inputs.output }}.exe" @extra

    - name: Upload Linux/macOS artifact
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.output }}-${{ runner.os }}
        path: bin/${{ inputs.output }}

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.output }}-windows
        path: bin\${{ inputs.output }}.exe
